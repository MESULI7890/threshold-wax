<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
  (function(){
    var b=document.getElementById('menuBtn'), n=document.getElementById('navLinks');
    if(b) b.addEventListener('click',function(){ var o=n.classList.toggle('open'); b.setAttribute('aria-expanded',o); b.textContent=o?'Close':'Menu'; });
  })();
  window.showToast=function(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(window._tt); window._tt=setTimeout(function(){t.classList.remove('show');},2400); };
</script>
